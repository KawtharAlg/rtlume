name: Bug report
description: Report a reproducible false negative, false positive, or CLI defect.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove private data, credentials, and employer-owned code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RTLume and Node.js versions
    validations:
      required: true
